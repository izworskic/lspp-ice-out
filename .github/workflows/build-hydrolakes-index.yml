name: Build HydroLAKES ice-out index

on:
  workflow_dispatch:
  push:
    branches:
      - official-lake-search
    paths:
      - scripts/build_hydrolakes_index.py
      - .github/workflows/build-hydrolakes-index.yml

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DBF reader
        run: pip install dbfread==2.0.7
      - name: Build compact North America shards
        run: python scripts/build_hydrolakes_index.py --output north-america/data/hydrolakes --min-area 0.5 --shard-size 2
      - name: Commit derived index
        run: |
          git config user.name "ice-out-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add north-america/data/hydrolakes
          if git diff --cached --quiet; then
            echo "No HydroLAKES index changes"
          else
            git commit -m "Build derived HydroLAKES morphometry index"
            git push origin HEAD:${{ github.ref_name }}
          fi

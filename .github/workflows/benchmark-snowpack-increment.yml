name: Benchmark snowpack increment for ice-out

on:
  workflow_dispatch:
  push:
    branches:
      - seasonal-physics
    paths:
      - scripts/benchmark_snowpack_increment.py
      - .github/workflows/benchmark-snowpack-increment.yml

permissions:
  contents: write

concurrency:
  group: snowpack-increment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: pip install numpy==2.1.3 scikit-learn==1.5.2
      - name: Run held-out snowpack increment benchmark
        run: python scripts/benchmark_snowpack_increment.py
      - name: Commit benchmark result safely
        run: |
          git config user.name "ice-out-snow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add north-america/data/seasonal-physics/snowpack-increment.json
          if git diff --cached --quiet; then
            echo "No snowpack benchmark changes"
            exit 0
          fi
          cp north-america/data/seasonal-physics/snowpack-increment.json /tmp/snowpack-increment.json
          git reset --hard
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
          cp /tmp/snowpack-increment.json north-america/data/seasonal-physics/snowpack-increment.json
          git add north-america/data/seasonal-physics/snowpack-increment.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update observed snowpack increment benchmark"
          git push origin "HEAD:${GITHUB_REF_NAME}"

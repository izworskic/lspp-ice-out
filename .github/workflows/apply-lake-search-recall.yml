name: Apply lake search recall fix

on:
  push:
    branches:
      - fix/lake-search-recall
    paths:
      - scripts/patch-lake-search-recall.py
      - .github/workflows/apply-lake-search-recall.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lake-search-recall
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply search patch
        run: python scripts/patch-lake-search-recall.py
      - name: Check browser JavaScript
        run: node --check north-america/app.js
      - name: Validate search changes
        run: |
          grep -q "resultRecordCount:'75'" north-america/app.js
          grep -q "num:'75'" north-america/app.js
          grep -q "function rankLakeResults" north-america/app.js
          grep -q "slice(0,24)" north-america/app.js
          if grep -q "filter(l=>/lake|reservoir|pond|flowage/i.test(l.featureClass))" north-america/app.js; then
            echo 'Old restrictive U.S. hydrographic filter remains'
            exit 1
          fi
      - name: Smoke official registry APIs
        run: |
          node <<'NODE'
          const tests = [
            ['USGS', "https://carto.nationalmap.gov/arcgis/rest/services/geonames/MapServer/7/query?where="+encodeURIComponent("gaz_name LIKE '%Higgins%'")+"&outFields=gaz_id,gaz_name,gaz_featureclass,state_alpha,county_name&returnGeometry=true&outSR=4326&f=geojson&resultRecordCount=75"],
            ['NRCan', 'https://geogratis.gc.ca/services/geoname/en/geonames.json?q=Opeongo&category=O&concise=LAKE&num=75&expand=items.concise,items.province&select=items.concise.term,items.province.description']
          ];
          for (const [name,url] of tests) {
            const r=await fetch(url,{headers:{Accept:'application/json,application/geo+json'}});
            if(!r.ok) throw new Error(`${name} ${r.status}`);
            const j=await r.json();
            const count=Array.isArray(j)?j.length:(j.features?.length ?? j.items?.length ?? j.results?.length ?? 0);
            console.log(name,'candidate count',count);
            if(count<1) throw new Error(`${name} returned no candidates`);
          }
          NODE
      - name: Commit patched runtime
        run: |
          if git diff --quiet -- north-america/app.js; then
            echo 'Patch already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add north-america/app.js
          git commit -m 'Improve official lake search recall and ranking'
          git push origin HEAD:fix/lake-search-recall

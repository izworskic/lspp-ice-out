name: Temporary open-water patch runner

on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-patch-open-water.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/current-open-water-state
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python scripts/patch-current-open-water-state.py
      - run: node --check north-america/app.js
      - run: |
          grep -q 'OPEN-WATER SEASON' north-america/app.js
          grep -q 'ice-out is already complete' north-america/app.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add north-america/app.js
          git commit -m 'Show current open-water state before freeze-up'
          git push origin HEAD:fix/current-open-water-state

name: Temporary open-water validation

on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-patch-open-water.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/current-open-water-state
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check browser runtime syntax
        run: node --check north-america/app.js
      - name: Check September current-state behavior
        run: |
          grep -q 'OPEN-WATER SEASON' north-america/app.js
          grep -q 'this spring.*ice-out is already complete' north-america/app.js
          grep -q "currentOpen?100" north-america/app.js
          grep -q "Next spring median" north-america/app.js
          node <<'NODE'
          const openWaterSeason=d=>d.getMonth()===7||d.getMonth()===8;
          const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
          const sep7=new Date(2026,8,7), sep7later=new Date(2026,8,7,20), oct7=new Date(2026,9,7), apr15=new Date(2026,3,15);
          if(!openWaterSeason(sep7)) throw new Error('September must use open-water state');
          if(openWaterSeason(oct7)||openWaterSeason(apr15)) throw new Error('Open-water override expanded beyond conservative Aug-Sep window');
          if(!sameDay(sep7,sep7later)) throw new Error('Today matching failed');
          NODE

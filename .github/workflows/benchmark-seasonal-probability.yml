name: Benchmark seasonal probability calibration

on:
  workflow_dispatch:
  push:
    branches:
      - seasonal-physics
    paths:
      - scripts/benchmark_seasonal_probability.py
      - .github/workflows/benchmark-seasonal-probability.yml

permissions:
  contents: write

concurrency:
  group: seasonal-probability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: pip install numpy==2.1.3 scikit-learn==1.5.2
      - name: Run seasonal probability benchmark
        run: python scripts/benchmark_seasonal_probability.py
      - name: Commit probability report safely
        run: |
          git config user.name "ice-out-probability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add north-america/data/seasonal-physics/probability-calibration.json
          if git diff --cached --quiet; then exit 0; fi
          cp north-america/data/seasonal-physics/probability-calibration.json /tmp/probability-calibration.json
          git reset --hard
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
          cp /tmp/probability-calibration.json north-america/data/seasonal-physics/probability-calibration.json
          git add north-america/data/seasonal-physics/probability-calibration.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update seasonal probability calibration"
          git push origin "HEAD:${GITHUB_REF_NAME}"

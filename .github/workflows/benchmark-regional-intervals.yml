name: Benchmark regional ice-out intervals

on:
  workflow_dispatch:
  push:
    branches:
      - seasonal-physics
    paths:
      - scripts/benchmark_regional_intervals.py
      - .github/workflows/benchmark-regional-intervals.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calibrate regional interval coverage
        run: python scripts/benchmark_regional_intervals.py
      - name: Commit report
        run: |
          git config user.name "ice-out-validation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add north-america/data/ice-history/regional-interval-validation.json
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Update regional interval validation"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi

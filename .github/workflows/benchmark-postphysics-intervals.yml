name: Benchmark post-physics ice-out intervals

on:
  workflow_dispatch:
  push:
    branches:
      - seasonal-physics
    paths:
      - scripts/benchmark_postphysics_intervals.py
      - .github/workflows/benchmark-postphysics-intervals.yml

permissions:
  contents: write

concurrency:
  group: postphysics-intervals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: pip install numpy==2.1.3 scikit-learn==1.5.2
      - name: Run post-physics interval calibration
        run: python scripts/benchmark_postphysics_intervals.py
      - name: Commit interval report safely
        run: |
          git config user.name "ice-out-interval-bot"
          git config user.email "actions@users.noreply.github.com"
          git add north-america/data/seasonal-physics/postphysics-intervals.json
          if git diff --cached --quiet; then exit 0; fi
          cp north-america/data/seasonal-physics/postphysics-intervals.json /tmp/postphysics-intervals.json
          git reset --hard
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
          cp /tmp/postphysics-intervals.json north-america/data/seasonal-physics/postphysics-intervals.json
          git add north-america/data/seasonal-physics/postphysics-intervals.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update post-physics interval calibration"
          git push origin "HEAD:${GITHUB_REF_NAME}"

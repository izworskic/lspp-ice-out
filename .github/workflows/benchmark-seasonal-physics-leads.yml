name: Benchmark seasonal ice-out physics by lead

on:
  workflow_dispatch:
  push:
    branches:
      - seasonal-physics
    paths:
      - scripts/benchmark_seasonal_physics_leads.py
      - .github/workflows/benchmark-seasonal-physics-leads.yml

permissions:
  contents: write

concurrency:
  group: seasonal-physics-leads-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: pip install numpy==2.1.3 scikit-learn==1.5.2
      - name: Run multi-lead seasonal physics benchmark
        run: python scripts/benchmark_seasonal_physics_leads.py
      - name: Commit benchmark result safely
        run: |
          git config user.name "ice-out-physics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add north-america/data/seasonal-physics/lead-models.json
          if git diff --cached --quiet; then
            echo "No multi-lead benchmark changes"
            exit 0
          fi
          cp north-america/data/seasonal-physics/lead-models.json /tmp/lead-models.json
          git reset --hard
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
          cp /tmp/lead-models.json north-america/data/seasonal-physics/lead-models.json
          git add north-america/data/seasonal-physics/lead-models.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update multi-lead seasonal physics benchmark"
          git push origin "HEAD:${GITHUB_REF_NAME}"

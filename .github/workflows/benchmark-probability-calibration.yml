name: Benchmark ice-out probability calibration

on:
  workflow_dispatch:
  push:
    branches:
      - seasonal-physics
    paths:
      - scripts/benchmark_probability_calibration.py
      - .github/workflows/benchmark-probability-calibration.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run rolling-origin probability benchmark
        run: python scripts/benchmark_probability_calibration.py
      - name: Commit probability validation
        run: |
          git config user.name "ice-out-validation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add north-america/data/ice-history/probability-validation.json
          if git diff --cached --quiet; then
            echo "No probability validation changes"
          else
            git commit -m "Update ice-out probability validation"
            git push origin HEAD:${{ github.ref_name }}
          fi

name: Benchmark IMS lake-state classifier

on:
  workflow_dispatch:
  push:
    branches:
      - seasonal-physics
    paths:
      - scripts/benchmark_ims_classifier.py
      - .github/workflows/benchmark-ims-classifier.yml

permissions:
  contents: write

concurrency:
  group: ims-classifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raster dependencies
        run: pip install numpy==2.1.3 rasterio==1.4.3 pyproj==3.7.0
      - name: Run held-out IMS classifier benchmark
        run: python scripts/benchmark_ims_classifier.py
      - name: Commit benchmark report safely
        run: |
          git config user.name "ice-out-satellite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add north-america/data/satellite/ims-classifier-benchmark.json
          if git diff --cached --quiet; then exit 0; fi
          cp north-america/data/satellite/ims-classifier-benchmark.json /tmp/ims-classifier-benchmark.json
          git reset --hard
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
          mkdir -p north-america/data/satellite
          cp /tmp/ims-classifier-benchmark.json north-america/data/satellite/ims-classifier-benchmark.json
          git add north-america/data/satellite/ims-classifier-benchmark.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update held-out IMS classifier benchmark"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Apply North America search UI
on:
  push:
    branches: [fix/canada-map-workspace]
    paths: ['.github/workflows/apply-north-america-search-ui.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canada-map-workspace
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/patch_north_america_search_ui.py
      - name: Syntax and architecture gates
        run: |
          node --check north-america/app.js
          node --check north-america/ux.js
          node --check api/lake-search.js
          grep -F 'searchStaticLakeIndex' north-america/app.js
          ! grep -F 'searchStaticUSLakeIndex' north-america/app.js
          grep -F "country==='CA'?'NRCan CGNDB lake database'" north-america/app.js
          grep -F 'class="workspace"' north-america/index.html
          grep -F 'class="map-pane"' north-america/index.html
          grep -F 'background:#fff' north-america/styles.css
          ! grep -F 'persona-row' north-america/index.html
          grep -F "CA_NAMES='https://geogratis.gc.ca/services/geoname/en/geonames.json'" api/lake-search.js
          grep -F "ontario:'ON'" api/lake-search.js
      - name: Commit runtime integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add north-america/app.js
          git commit -m 'Unify browser lake search across US and Canada'
          git push origin HEAD:fix/canada-map-workspace

name: Validate temporal ice-out history

on:
  workflow_dispatch:
  push:
    branches:
      - historical-calibration
    paths:
      - scripts/validate_temporal_history.py
      - .github/workflows/validate-temporal-history.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run rolling-origin history benchmark
        run: python scripts/validate_temporal_history.py
      - name: Commit benchmark report
        run: |
          git config user.name "ice-out-validation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add north-america/data/ice-history/temporal-validation.json
          if git diff --cached --quiet; then
            echo "No temporal validation changes"
          else
            git commit -m "Update temporal ice-out validation"
            git push origin HEAD:${{ github.ref_name }}
          fi

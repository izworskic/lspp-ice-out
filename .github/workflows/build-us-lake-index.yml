name: Build US static lake database

on:
  push:
    branches: [feature/us-lake-database]
    paths:
      - scripts/build_us_lake_index.py
      - .github/workflows/build-us-lake-index.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/us-lake-database
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build complete GNIS lake database
        run: python scripts/build_us_lake_index.py
      - name: Validate Black Lake Michigan and index
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('north-america/data/lake-index')
          m=json.loads((p/'manifest.json').read_text())
          assert m['us_records']>10000, m
          rows=json.loads((p/'bl.json').read_text())
          hits=[r for r in rows if r[4]=='US' and r[2]=='MI' and r[1].lower()=='black lake']
          assert hits, 'Black Lake MI missing'
          print('Black Lake MI:', hits)
          print('records:',m['us_records'],'shards:',m['shards'])
          PY
      - name: Commit generated database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add north-america/data/lake-index
          git commit -m 'Build complete USGS GNIS lake database'
          git push origin HEAD:feature/us-lake-database

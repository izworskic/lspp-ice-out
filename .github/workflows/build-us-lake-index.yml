name: Build US static lake database

on:
  push:
    branches: [feature/us-lake-database]
    paths:
      - scripts/build_us_lake_index.py
      - scripts/patch_search_result_county.py
      - .github/workflows/build-us-lake-index.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/us-lake-database
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build complete GNIS lake database
        run: python scripts/build_us_lake_index.py
      - name: Validate Black Lake Michigan and index
        run: |
          python - <<'PY'
          import json, pathlib, re
          p=pathlib.Path('north-america/data/lake-index')
          m=json.loads((p/'manifest.json').read_text())
          assert m['us_records']>10000, m
          rows=json.loads((p/'bl.json').read_text())
          hits=[r for r in rows if r[4]=='US' and r[2]=='MI' and r[1].lower()=='black lake']
          assert hits, 'Black Lake MI missing'
          name='black lake'; state='MI'
          key=re.sub('[^a-z0-9]','',name.replace('lake','').strip())[:2]
          assert key=='bl'
          ranked=[r for r in rows if r[2]==state and r[1].lower()==name]
          assert len(ranked)>=1
          print('Black Lake MI:', ranked)
          print('records:',m['us_records'],'shards:',m['shards'])
          PY
      - name: Disambiguate duplicate names by county
        run: python scripts/patch_search_result_county.py
      - name: Validate browser database runtime
        run: |
          node --check north-america/app.js
          grep -q "const LAKE_INDEX_BASE = 'data/lake-index'" north-america/app.js
          grep -q "function splitLakeRegionQuery" north-america/app.js
          grep -q "searchStaticUSLakeIndex(q)" north-america/app.js
          grep -q "USGS GNIS lake database" north-america/app.js
          grep -q "const place=l.county?" north-america/app.js
      - name: Commit validated database runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add north-america/data/lake-index north-america/app.js
          if git diff --cached --quiet; then
            echo 'Validated database/runtime unchanged'
            exit 0
          fi
          git commit -m 'Disambiguate lake database results by county'
          git pull --rebase origin feature/us-lake-database
          git push origin HEAD:feature/us-lake-database

name: Inject empirical ice-out probability runtime

on:
  workflow_dispatch:
  push:
    branches:
      - seasonal-physics
    paths:
      - scripts/inject_empirical_probability_runtime.py
      - north-america/data/ice-history/nsidc-calibration.json
      - .github/workflows/inject-empirical-probability.yml

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inject validated empirical probability runtime
        run: python scripts/inject_empirical_probability_runtime.py
      - name: Check browser JavaScript syntax
        run: node --check north-america/app.js
      - name: Commit runtime
        run: |
          git config user.name "ice-out-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add north-america/app.js
          if git diff --cached --quiet; then
            echo "No runtime changes"
          else
            git commit -m "Use empirically calibrated direct-history probabilities"
            git push origin HEAD:${{ github.ref_name }}
          fi

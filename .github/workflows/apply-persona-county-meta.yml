name: Apply persona county meta
on:
  push:
    branches: [ux/persona-lake-forecast]
    paths: ['.github/workflows/apply-persona-county-meta.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/persona-lake-forecast
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/patch_persona_county_meta.py
      - run: node --check north-america/app.js
      - name: Assert county identity and persona UI
        run: |
          grep -F 'const place=lake.county?' north-america/app.js
          grep -F 'county:String(p.county_name' north-america/app.js
          grep -F 'County · ${x.lake.region}' north-america/app.js
          grep -F 'Find your lake' north-america/index.html
          grep -F 'background:#fff' north-america/styles.css
          node --check north-america/ux.js
      - name: Commit runtime patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add north-america/app.js
          git commit -m 'Preserve lake county identity in selected and nearby views'
          git push origin HEAD:ux/persona-lake-forecast

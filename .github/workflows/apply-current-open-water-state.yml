name: Apply current open-water state

on:
  push:
    branches:
      - fix/current-open-water-state
    paths:
      - .github/workflows/apply-current-open-water-state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/current-open-water-state
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply patch
        run: python scripts/patch-current-open-water-state.py
      - name: Validate runtime
        run: |
          node --check north-america/app.js
          grep -q 'OPEN-WATER SEASON' north-america/app.js
          grep -q 'ice-out is already complete' north-america/app.js
          node -e "const d=new Date(2026,8,7); if(!(d.getMonth()===7||d.getMonth()===8)) process.exit(1)"
      - name: Commit patched runtime
        run: |
          if git diff --quiet -- north-america/app.js; then
            echo 'Patch already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add north-america/app.js
          git commit -m 'Show current open-water state before freeze-up'
          git push origin HEAD:fix/current-open-water-state

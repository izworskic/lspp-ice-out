name: Validate ice-out calibration

on:
  workflow_dispatch:
  push:
    branches:
      - historical-calibration
    paths:
      - scripts/validate_iceout_calibration.py
      - north-america/data/ice-history/nsidc-calibration.json
      - .github/workflows/validate-iceout-calibration.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run leave-one-lake-out benchmark
        run: python scripts/validate_iceout_calibration.py
      - name: Commit validation report
        run: |
          git config user.name "ice-out-validation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add north-america/data/ice-history/validation.json
          if git diff --cached --quiet; then
            echo "No validation changes"
          else
            git commit -m "Update ice-out calibration validation"
            git push origin HEAD:${{ github.ref_name }}
          fi
